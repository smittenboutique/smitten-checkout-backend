<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .item { display:flex; gap:12px; margin-bottom:12px; align-items:center; }
        img { width:50px; height:50px; }
        button { margin-top:20px; padding:10px 16px; }
    </style>
</head>

<body>

<h2>Your Cart</h2>
<div id="status">Loading...</div>
<div id="items"></div>

<button id="continue">Continue to Checkout</button>

<script>
document.getElementById("continue").onclick = async () => {

    console.log("BUTTON CLICKED");

    try {
console.log("Sending items:", [
    { id: "ring-001", name: "Gold Ring", qty: 2, price: 2500 },
    { id: "necklace-002", name: "Necklace", qty: 1, price: 5000 }
]);
        const res = await fetch("/api/create-checkout", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
    items: [
        {
            id: "ring-001",
            name: "Gold Ring",
            qty: 2,
            price: 2500
        },
        {
            id: "necklace-002",
            name: "Necklace",
            qty: 1,
            price: 5000
        }
    ]
})
        });

        console.log("STATUS:", res.status);

        const data = await res.json();

        console.log(data);

        if (data.success) {
            window.location.href = data.checkout_url;
        } else {
            alert("Checkout failed");
        }

    } catch (err) {

        console.error("FETCH ERROR:", err);
    }
};
</script>

</body>
</html>
