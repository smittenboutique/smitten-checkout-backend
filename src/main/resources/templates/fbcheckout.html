<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .item { display:flex; gap:12px; margin-bottom:12px; align-items:center; }
        img { width:50px; height:50px; }
        button { margin-top:20px; padding:10px 16px; }
    </style>
</head>

<body>

<h2>Your Cart</h2>
<div id="status">Loading...</div>
    
<div id="items"></div>
    <button onclick="addToCart({
    id:'ring',
    name:'Gold Ring',
    price:2500
})">
    Add Ring
</button>

<button onclick="addToCart({
    id:'necklace',
    name:'Necklace',
    price:5000
})">
    Add Necklace
</button>
    
<button id="continue">Continue to Checkout</button>

<script>
    let cart = [];
    function addToCart(item) {

    const existing = cart.find(i => i.id === item.id);

    if (existing) {

        existing.qty += 1;

    } else {

        cart.push({
            ...item,
            qty: 1
        });
    }

    renderCart();
}
    function renderCart() {
    const container = document.getElementById("items");
    container.innerHTML = "";

    cart.forEach((i, index) => {
        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            <div>
                <b>${i.name}</b><br/>
                $${(i.price / 100).toFixed(2)}
            </div>
            <div>
    <button onclick="decreaseQty(${index})">-</button>
    <span style="margin:0 8px;">${i.qty}</span>
    <button onclick="increaseQty(${index})">+</button>
</div>
function increaseQty(index) {

    cart[index].qty += 1;

    renderCart();
}

function decreaseQty(index) {

    cart[index].qty -= 1;

    if (cart[index].qty <= 0) {
        cart.splice(index, 1);
    }

    renderCart();
}
        `;

        container.appendChild(div);
    });

    document.getElementById("status").innerText =
        cart.length ? "Ready to checkout" : "Cart empty";
}
    function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
}
    renderCart();
    
    document.getElementById("continue").onclick = async () => {
        console.log("BUTTON CLICKED");
            try {
                const res = await fetch("/api/create-checkout", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                body: JSON.stringify({
                    items: cart
                })
        });

        console.log("STATUS:", res.status);

        const data = await res.json();

        console.log(data);

        if (data.success) {
            window.location.href = data.checkout_url;
        } else {
            alert("Checkout failed");
        }

    } catch (err) {

        console.error("FETCH ERROR:", err);
    }
};
</script>

</body>
</html>
