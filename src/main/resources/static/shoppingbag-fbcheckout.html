<body>

<button id="continue">Continue to Checkout</button>

<!-- your script stays here -->

</div>
<script>
async function loadCatalog() {

    const params = new URLSearchParams(window.location.search);
    const rawItems =
    params.get("items") ||
    params.get("product") ||
    params.get("products");

    // fetch catalog

    const res = await fetch("/api/catalog");
    const data = await res.json();

    if (!data.success) {
        document.getElementById("status").innerText = "Catalog failed to load";
        return;
    }

    const items = data.products || data.objects || [];

if (rawItems) {
    const productsEl = document.getElementById("products");
if (productsEl) {
    productsEl.style.display = "none";
}

hydrateCart(items);    
return;
}
    hydrateCart(items);
    document.getElementById("status").innerText =
        "Catalog loaded";
}
    function preloadCartFromUrl() {
console.log("FULL URL:", window.location.href);
console.log("QUERY PARAMS:", Object.fromEntries(
    new URLSearchParams(window.location.search)
));
    const params = new URLSearchParams(window.location.search);
    const rawItems =
    params.get("items") ||
    params.get("product") ||
    params.get("products");

    if (!rawItems) return;

    cart = rawItems.split(",").map(entry => {
        const [catalog_object_id, qty] = entry.split(":");

        return {
            catalog_object_id,
            qty: Number(qty || 1)
        };
    });

    saveCart();
    renderCart();
}
    function hydrateCart(catalogItems) {
    cart = cart.map(cartItem => {

        let matchedProduct = null;
        let matchedVariation = null;

        catalogItems.forEach(p => {

            if (p.type === "ITEM") {
                const itemData = p.item_data;
                const variations = itemData?.variations || [];

                variations.forEach(v => {
                    if (v.id === cartItem.catalog_object_id) {
                        matchedProduct = p;
                        matchedVariation = v;
                    }
                });
            }

            if (p.type === "ITEM_VARIATION" && p.id === cartItem.catalog_object_id) {
                matchedProduct = p;
                matchedVariation = p;
            }
        });
if (!matchedProduct || !matchedVariation) {
    console.log("HYDRATION FAILED FOR:", cartItem.catalog_object_id);
}
        if (!matchedProduct || !matchedVariation) {
            return cartItem;
        }

        const itemData = matchedProduct.item_data || {};
        const variationData =
            matchedVariation.item_variation_data || {};

        const priceMoney = variationData.price_money || {};

        return {
            ...cartItem,
            name: itemData.name || variationData.name || cartItem.name,
            variantName: variationData.name || "",
            price: priceMoney.amount || 0,
            image_url: cartItem.image_url
        };
    });

    saveCart();
    renderCart();
}


    let cart = JSON.parse(
    localStorage.getItem("smitten_cart") || "[]"
);
    
    function saveCart() {
    localStorage.setItem(
        "smitten_cart",
        JSON.stringify(cart)
    );
}
    
function addToCart(item) {

    const existing = cart.find(i =>
        i.catalog_object_id === item.catalog_object_id
    );

    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({
            catalog_object_id: item.catalog_object_id,
            name: item.name,
            price: item.price,
            qty: 1
        });
    }

    renderCart();
    saveCart();
}
async function copyProductLink(catalogId) {

    const url =
        window.location.origin +
        `/fbcheckout?items=${catalogId}:1`;

    try {
        await navigator.clipboard.writeText(url);

        alert("Product link copied!");

    } catch (err) {
        console.error(err);
        alert(url);
    }
}
function renderCart() {

    const container = document.getElementById("cart");
    container.innerHTML = "";
    
    cart.forEach((i, index) => {
        const div = document.createElement("div");
        div.className = "cart-row";        

        const price = i.price
            ? `$${((i.price * i.qty) / 100).toFixed(2)}`
            : "";
      
        const productLink = i.name
    ? `https://www.thesmittenboutique.com/s/search?q=${encodeURIComponent(i.name)}`
    : "https://www.thesmittenboutique.com";

const displayName = i.name || i.catalog_object_id;
const variantInfo = i.variantName && i.variantName !== "Regular"
    ? i.variantName
    : "";
       
div.innerHTML = `
    <div class="cart-info">
        <a class="cart-title" href="${productLink}" target="_blank">
            ${displayName}
        </a>

        ${variantInfo ? `<div class="variant-info">${variantInfo}</div>` : ""}

        <span class="price">${price}</span>
    </div>

    <div class="qty-controls">
        <button class="qty-btn" onclick="decreaseQty(${index})">-</button>
        <span>${i.qty}</span>
        <button class="qty-btn" onclick="increaseQty(${index})">+</button>
    </div>
`;

        container.appendChild(div);
    });

    updateSubtotal();

document.getElementById("continue").disabled = cart.length === 0;
    
}

function increaseQty(index) {

    cart[index].qty += 1;

    renderCart();
    saveCart();
}

function decreaseQty(index) {

    cart[index].qty -= 1;

    if (cart[index].qty <= 0) {
        cart.splice(index, 1);
    }

    renderCart();
    saveCart();
}
    
function getCouponCode() {
    const params = new URLSearchParams(window.location.search);

    return (
        params.get("coupon") ||
        params.get("discount") ||
        params.get("promo")
    );
}

function updateSubtotal() {
    const subtotal = cart.reduce((sum, item) => {
        return sum + ((item.price || 0) * item.qty);
    }, 0);

    const coupon = getCouponCode();

const couponPercentages = {
    WELCOME: 10
};

const percent = coupon
    ? couponPercentages[coupon.toUpperCase()]
    : null;

const discount = percent
    ? Math.round(subtotal * (percent / 100))
    : 0;

const shippingNote =
    coupon?.toUpperCase() === "VIPSHIP"
        ? `
            <div style="color:#c5aa78;">
                VIPSHIP applied at checkout
            </div>
        `
        : "";

    document.getElementById("subtotal").innerHTML =
    cart.length
        ? `
            <div>
                Subtotal: $${(subtotal / 100).toFixed(2)}
            </div>

            ${
                discount
                    ? `
                        <div style="color: #c5aa78;">
                            Discount: -$${(discount / 100).toFixed(2)}
                        </div>
                    `
                    : ""
            }
${shippingNote}
            <div style="font-size: 13px;">
                Tax calculated at checkout
            </div>
        `
        : "";
}

    function productUrlFromName(name) {
    const slug = name
        .toLowerCase()
        .replaceAll("&", "and")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");

    return `https://www.thesmittenboutique.com/product/${slug}`;
}
    
document.getElementById("continue").onclick = async () => {
    const params = new URLSearchParams(window.location.search);
    
    const checkoutButton = document.getElementById("continue");
    checkoutButton.disabled = true;
    checkoutButton.innerText = "Preparing checkout...";

    if (cart.length === 0) {
        alert("Your cart is empty");
        checkoutButton.disabled = false;
        checkoutButton.innerText = "Continue to Checkout";
        return;
    }
    console.log("BUTTON CLICKED");

    try {

        const res = await fetch("/api/create-checkout", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

body: JSON.stringify({
    source: params.get("source"),
    campaign: params.get("campaign"),
    coupon: params.get("coupon") || params.get("discount") || params.get("promo"),

    items: cart.map(i => ({
                    catalog_object_id: i.catalog_object_id,
                    quantity: i.qty
                }))
            })
        });

        console.log("STATUS:", res.status);

        const data = await res.json();

        console.log(data);

        if (data.success) {
    sessionStorage.setItem(
        "checkout_started",
        "true"
    );

    window.location.href = data.checkout_url;
} else {

            alert("Checkout failed: " + (data.error || "Please try again."));
            checkoutButton.disabled = false;
            checkoutButton.innerText = "Continue to Checkout";
        }

    } catch (err) {
        checkoutButton.disabled = false;
        checkoutButton.innerText = "Continue to Checkout";
        console.error("FETCH ERROR:", err);
    }
};

saveCart();
preloadCartFromUrl();
loadCatalog();
    
</script>
