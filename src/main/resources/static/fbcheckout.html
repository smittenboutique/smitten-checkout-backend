<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="data:,">
    <title>Checkout</title>
<style>
    @import url('https://fonts.cdnfonts.com/css/brandon-grotesque');
    body {
        font-family: 'Brandon Grotesque', sans-serif;
        margin: 0;
        background: #faf7f2;
        color: #2f2a25;
    }

    .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 36px 20px 60px;
    }

    h2 {
        font-size: 34px;
        font-weight: 300;
        letter-spacing: .04em;
    }

    .subtitle {
        font-size: 12px;
        letter-spacing: .18em;
        text-transform: uppercase;
    }

    h3 {
        font-size: 18px;
        letter-spacing: .08em;
        text-transform: uppercase;
    }
    #products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 22px;
    }

    .product-card b,
    .cart-row b {
        font-size: 16px;
        font-weight: 300;
        letter-spacing: .02em;
    }

    .product-card b,
    .cart-row b {
        font-size: 17px;
        font-weight: 400;
    }

    .price {
        margin: 8px 0 14px;
        font-family: 'Brandon Grotesque', sans-serif;
        color: #7d6658;
    }

    button {
        border: 1px solid #2f2a25;
        background: #2f2a25;
        color: white;
        padding: 12px 18px;
        font-family: 'Brandon Grotesque', sans-serif;
        text-transform: uppercase;
        letter-spacing: .14em;
        font-size: 11px;
        font-weight: 250;
        cursor: pointer;
        transition: .2s ease;
    }

    button:hover {
        background: white;
        color: #2f2a25;
    }

    .qty-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
    }

    .qty-controls button {
        padding: 5px 10px;
    }

    .product-image {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    background: #f4efe8;
    border: 1px solid #eadfd5;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9a8171;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

    #continue {
        width: 100%;
        margin-top: 28px;
        padding: 14px;
    }

    #status {
        text-align: center;
        font-family: 'Brandon Grotesque', sans-serif;
        color: #8a7466;
        margin-bottom: 20px;
    }

    @media (max-width: 640px) {
    .page {
        padding: 24px 14px 48px;
    }

    h2 {
        font-size: 28px;
        text-align: center;
    }

    .subtitle {
        text-align: center;
        margin-bottom: 24px;
    }

    #products {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .product-card,
    .cart-row {
        padding: 16px;
    }

    .cart-row {
        display: block;
    }

    .qty-controls {
        margin-top: 14px;
        justify-content: space-between;
    }

    .qty-controls button {
        min-width: 44px;
        min-height: 44px;
    }

    button {
        width: 100%;
        min-height: 46px;
    }

    #continue {
        position: sticky;
        bottom: 0;
        z-index: 10;
        margin-top: 24px;
    }

    #subtotal {
        font-size: 16px;
        text-align: center;
        margin-top: 18px;
        padding: 12px 0;
    }
}
</style>
</head>

<body>
<div class="page">

<h2>Your Cart</h2>
<div class="subtitle">Smitten checkout</div>

<div id="status">Loading...</div>

<h3>Products</h3>
<div id="products"></div>

<h3>Cart</h3>
<div id="cart"></div>
<div id="subtotal"></div>
<button id="continue">Continue to Checkout</button>

<!-- your script stays here -->

</div>
<script>
async function loadCatalog() {

    const res = await fetch("/api/catalog");
    const data = await res.json();

    if (!data.success) {
        document.getElementById("status").innerText = "Catalog failed to load";
        return;
    }

    const container = document.getElementById("products");
    container.innerHTML = "";

    const items = data.products || data.objects || [];
   items.forEach(obj => {

    if (obj.type !== "ITEM") return;

    const itemData = obj.item_data;
       
    if (!itemData) return;

    const variation = itemData.variations?.[0];
    if (!variation) return;

    const variationData = variation.item_variation_data || {};
    const priceMoney = variationData.price_money || {};

    const catalogId = variation.id;
    const name = itemData.name || "Smitten Item";
    const price = priceMoney.amount || 0;

    const card = document.createElement("div");
    card.className = "product-card";

    card.innerHTML = `
    <div class="product-image">
        Smitten
    </div>

    <div class="product-info">
        <b>${name}</b>
        <div class="price">
            ${price ? `$${(price / 100).toFixed(2)}` : ""}
        </div>
    </div>

    <button onclick="addToCart({
        catalog_object_id: '${catalogId}',
        name: '${name}',
        price: ${price}
    })">
        Add to Cart
    </button>
`;
<button onclick="copyProductLink('${catalogId}')">
    Copy Product Link
</button>
    container.appendChild(card);
});
    hydrateCart(items);
    document.getElementById("status").innerText =
        "Catalog loaded";
}
    function preloadCartFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const rawItems = params.get("items");

    if (!rawItems) return;

    cart = rawItems.split(",").map(entry => {
        const [catalog_object_id, qty] = entry.split(":");

        return {
            catalog_object_id,
            qty: Number(qty || 1)
        };
    });

    saveCart();
    renderCart();
}
    function hydrateCart(catalogItems) {
    cart = cart.map(cartItem => {
        const product = catalogItems.find(p => {
            const itemData = p.item_data;
            const variation = itemData?.variations?.[0];
            return variation?.id === cartItem.catalog_object_id;
        });

        if (!product) return cartItem;

        const variation = product.item_data.variations[0];
        const priceMoney = variation.item_variation_data?.price_money || {};

        return {
            ...cartItem,
            name: product.item_data.name,
            price: priceMoney.amount || 0
        };
    });

    saveCart();
    renderCart();
    }


    let cart = JSON.parse(
    localStorage.getItem("smitten_cart") || "[]"
);
    
    function saveCart() {
    localStorage.setItem(
        "smitten_cart",
        JSON.stringify(cart)
    );
}
    
function addToCart(item) {

    const existing = cart.find(i =>
        i.catalog_object_id === item.catalog_object_id
    );

    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({
            catalog_object_id: item.catalog_object_id,
            name: item.name,
            price: item.price,
            qty: 1
        });
    }

    renderCart();
    saveCart();
}
async function copyProductLink(catalogId) {

    const url =
        window.location.origin +
        `/fbcheckout?items=${catalogId}:1`;

    try {
        await navigator.clipboard.writeText(url);

        alert("Product link copied!");

    } catch (err) {
        console.error(err);
        alert(url);
    }
}
function renderCart() {

    const container = document.getElementById("cart");

    container.innerHTML = "";

    cart.forEach((i, index) => {

        const div = document.createElement("div");

        div.className = "cart-row";

        const price = i.price
    ? `$${((i.price * i.qty) / 100).toFixed(2)}`
    : "";

div.innerHTML = `
    <div>
        <b>${i.name || i.catalog_object_id}</b><br/>
        <span class="price">${price}</span>
    </div>

    <div class="qty-controls">
        <button onclick="decreaseQty(${index})">-</button>
        <span>${i.qty}</span>
        <button onclick="increaseQty(${index})">+</button>
    </div>
`;
        container.appendChild(div);
    });

    document.getElementById("status").innerText =
        cart.length ? "Ready to checkout" : "Cart empty";
updateSubtotal();

document.getElementById("continue").disabled = cart.length === 0;
    
}

function increaseQty(index) {

    cart[index].qty += 1;

    renderCart();
    saveCart();
}

function decreaseQty(index) {

    cart[index].qty -= 1;

    if (cart[index].qty <= 0) {
        cart.splice(index, 1);
    }

    renderCart();
    saveCart();
}
    
function updateSubtotal() {
    const subtotal = cart.reduce((sum, item) => {
        return sum + ((item.price || 0) * item.qty);
    }, 0);

    document.getElementById("subtotal").innerText =
        cart.length
            ? `Subtotal: $${(subtotal / 100).toFixed(2)}`
            : "";
}
    
document.getElementById("continue").onclick = async () => {
    const checkoutButton = document.getElementById("continue");
checkoutButton.disabled = true;
checkoutButton.innerText = "Preparing checkout...";
if (cart.length === 0) {
    alert("Your cart is empty");
    return;
}
    console.log("BUTTON CLICKED");

    try {

        const res = await fetch("/api/create-checkout", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                items: cart.map(i => ({
                    catalog_object_id: i.catalog_object_id,
                    quantity: i.qty
                }))
            })
        });

        console.log("STATUS:", res.status);

        const data = await res.json();

        console.log(data);

        if (data.success) {
            localStorage.removeItem("smitten_cart");
            window.location.href = data.checkout_url;

        } else {

            alert("Checkout failed: " + (data.error || "Please try again."));
            checkoutButton.disabled = false;
            checkoutButton.innerText = "Continue to Checkout";
        }

    } catch (err) {
        checkoutButton.disabled = false;
        checkoutButton.innerText = "Continue to Checkout";
        console.error("FETCH ERROR:", err);
    }
};

saveCart();
preloadCartFromUrl();
loadCatalog();
renderCart();
    
</script>
</body>
</html>
