<!DOCTYPE html>
<html>
<head>

    <title>Shopping Bag</title>
<style>
    @import url('https://fonts.cdnfonts.com/css/brandon-grotesque');
    body {
        font-family: 'Brandon Grotesque', sans-serif;

.site-header {

.logo-wrap {
    display: flex;

    justify-content: center;
    width: 100%;

#continue {
    width: min(700px, 86vw);
    min-height: 118px;

    border: 0;

    text-transform: uppercase;

.page {
    min-height: calc(100vh - 230px);

        border: 1px solid #2f2a25;

.butterfly-mark {

.site-header {
    height: 170px;

}

        width: 100%;

    }

.page {
    min-height: calc(100vh - 230px);

    padding: 90px 24px 80px;

    gap: 32px;
}

    #continue {
        width: 100%;
        min-height: 96px;
        padding: 24px 28px;
        font-size: 18px;

.checkout-note {
    font-size: 18px;
    line-height: 1.45;

.butterfly-mark {
    width: 30px;

    .site-footer {

</style>
</head>

<body>
    <header class="site-header">

    <a
        href="https://www.thesmittenboutique.com"
        class="logo-wrap"
    >
        <img
            src="https://ef0c54a50a5a99fe62c8.cdn6.editmysite.com/uploads/b/ef0c54a50a5a99fe62c8cfe17f521cca97f804f3dd69d462788f1513b828c4e2/Logo-Gold_1766092768.png?width=2400&optimize=medium"
            class="header-logo"
            alt="Smitten Boutique"
        />
    </a>
</header>
<div class="page">

<div id="status" style="display:none;"></div>

<button id="continue">Continue to<br/>Checkout</button>

<div class="checkout-note">
    Taking you to secure checkout...
</div>

<img
    class="butterfly-mark"
    src="/images/butterfly.png"
    alt="...a sweet boutique"
/>

<!-- script stays here -->

</div>
<script>
async function loadCatalog() {

    const params = new URLSearchParams(window.location.search);
    const rawItems =
    params.get("items") ||
    params.get("product") ||
    params.get("products");

    // fetch catalog

    const res = await fetch("/api/catalog");
    const data = await res.json();

    if (!data.success) {
        document.getElementById("status").innerText = "Catalog failed to load";
        return;
    }

    const items = data.products || data.objects || [];

if (rawItems) {
    const productsEl = document.getElementById("products");
if (productsEl) {
    productsEl.style.display = "none";
}

hydrateCart(items);    
return;
}
    hydrateCart(items);
    document.getElementById("status").innerText =
        "Catalog loaded";
}
    function preloadCartFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const rawItems =
    params.get("items") ||
    params.get("product") ||
    params.get("products");

    if (!rawItems) return;

    cart = rawItems.split(",").map(entry => {
        const [catalog_object_id, qty] = entry.split(":");

        return {
            catalog_object_id,
            qty: Number(qty || 1)
        };
    });

    saveCart();
    renderCart();
}
    function hydrateCart(catalogItems) {
    cart = cart.map(cartItem => {

        let matchedProduct = null;
        let matchedVariation = null;

        catalogItems.forEach(p => {

            if (p.type === "ITEM") {
                const itemData = p.item_data;
                const variations = itemData?.variations || [];

                variations.forEach(v => {
                    if (v.id === cartItem.catalog_object_id) {
                        matchedProduct = p;
                        matchedVariation = v;
                    }
                });
            }

            if (p.type === "ITEM_VARIATION" && p.id === cartItem.catalog_object_id) {
                matchedProduct = p;
                matchedVariation = p;
            }
        });
if (!matchedProduct || !matchedVariation) {
    console.log("HYDRATION FAILED FOR:", cartItem.catalog_object_id);
}
        if (!matchedProduct || !matchedVariation) {
            return cartItem;
        }

        const itemData = matchedProduct.item_data || {};
        const variationData =
            matchedVariation.item_variation_data || {};

        const priceMoney = variationData.price_money || {};

        return {
            ...cartItem,
            name: itemData.name || variationData.name || cartItem.name,
            variantName: variationData.name || "",
            price: priceMoney.amount || 0,
            image_url: cartItem.image_url
        };
    });

    saveCart();
    renderCart();
    autoCheckoutIfReady();
}
    
function autoCheckoutIfReady() {
    if (cart.length === 0) return;

    setTimeout(() => {
        document.getElementById("continue").click();
    }, 1200);
}

    let cart = JSON.parse(
    localStorage.getItem("smitten_cart") || "[]"
);
    
    function saveCart() {
    localStorage.setItem(
        "smitten_cart",
        JSON.stringify(cart)
    );
}

function renderCart() {
    document.getElementById("continue").disabled = cart.length === 0;
}
    
function getCouponCode() {
    const params = new URLSearchParams(window.location.search);

    return (
        params.get("coupon") ||
        params.get("discount") ||
        params.get("promo")
    );
}
    
document.getElementById("continue").onclick = async () => {
    const params = new URLSearchParams(window.location.search);
    
    const checkoutButton = document.getElementById("continue");
    checkoutButton.disabled = true;
    checkoutButton.innerHTML = "Preparing<br/>checkout...";

    if (cart.length === 0) {
        alert("Your cart is empty");
        checkoutButton.disabled = false;
        checkoutButton.innerHTML = "Continue to<br/>Checkout";
        return;
    }

    try {

        const res = await fetch("/api/create-checkout", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

body: JSON.stringify({
    source: params.get("source"),
    campaign: params.get("campaign"),
    coupon: params.get("coupon") || params.get("discount") || params.get("promo"),

    items: cart.map(i => ({
                    catalog_object_id: i.catalog_object_id,
                    quantity: i.qty
                }))
            })
        });

        const data = await res.json();

        if (data.success) {
    sessionStorage.setItem(
        "checkout_started",
        "true"
    );

    window.location.href = data.checkout_url;
} else {

            alert("Checkout failed: " + (data.error || "Please try again."));
            checkoutButton.disabled = false;
            checkoutButton.innerText = "Continue to Checkout";
        }

    } catch (err) {
        checkoutButton.disabled = false;
        checkoutButton.innerText = "Continue to Checkout";
        console.error("FETCH ERROR:", err);
    }
};

saveCart();
preloadCartFromUrl();
loadCatalog();
    
</script>

    <footer class="site-footer">
    <div>Thank you for shopping Smitten</div>
</footer>

</body>
</html>
