<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .item { display:flex; gap:12px; margin-bottom:12px; align-items:center; }
        img { width:50px; height:50px; }
        button { margin-top:20px; padding:10px 16px; }
    </style>
</head>

<body>

<h2>Your Cart</h2>
<div id="status">Loading...</div>
    
<h3>Products</h3>
<div id="products"></div>

<h3>Cart</h3>
<div id="cart"></div>

    
<button id="continue">Continue to Checkout</button>

<script>
async function loadCatalog() {

    const res = await fetch("/api/catalog");
    const data = await res.json();

    if (!data.success) {
        document.getElementById("status").innerText = "Catalog failed to load";
        return;
    }

    const container = document.getElementById("products");
    container.innerHTML = "";

    const items = data.objects || [];

    items.forEach(obj => {

        if (obj.type !== "ITEM") return;

        const itemData = obj.item_data;
        const variation = itemData.variations?.[0];

        if (!variation) return;

        const card = document.createElement("div");

        card.className = "item";

        card.innerHTML = `
            <div>
                <b>${itemData.name}</b><br/>
                ${variation.id}
            </div>

            <button onclick="addToCart({
                catalog_object_id: '${variation.id}'
            })">
                Add
            </button>
        `;

        container.appendChild(card);
    });

    document.getElementById("status").innerText =
        "Catalog loaded";
}
let cart = [];

function addToCart(item) {

    const existing = cart.find(i =>
        i.catalog_object_id === item.catalog_object_id
    );

    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({
            catalog_object_id: item.catalog_object_id,
            qty: 1
        });
    }

    renderCart();
}

function renderCart() {

    const container = document.getElementById("cart");

    container.innerHTML = "";

    cart.forEach((i, index) => {

        const div = document.createElement("div");

        div.className = "item";

        div.innerHTML = `
            <div>
                <b>${i.catalog_object_id.slice(0,8)}...</b><br/>
                Qty: ${i.qty}
            </div>

            <div>
                <button onclick="decreaseQty(${index})">-</button>

                <span style="margin:0 8px;">
                    ${i.qty}
                </span>

                <button onclick="increaseQty(${index})">+</button>
            </div>
        `;

        container.appendChild(div);
    });

    document.getElementById("status").innerText =
        cart.length ? "Ready to checkout" : "Cart empty";
}

function increaseQty(index) {

    cart[index].qty += 1;

    renderCart();
}

function decreaseQty(index) {

    cart[index].qty -= 1;

    if (cart[index].qty <= 0) {
        cart.splice(index, 1);
    }

    renderCart();
}

document.getElementById("continue").onclick = async () => {
if (cart.length === 0) {
    alert("Cart is empty");
    return;
}
    console.log("BUTTON CLICKED");

    try {

        const res = await fetch("/api/create-checkout", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                items: cart.map(i => ({
                    catalog_object_id: i.catalog_object_id,
                    quantity: i.qty
                }))
            })
        });

        console.log("STATUS:", res.status);

        const data = await res.json();

        console.log(data);

        if (data.success) {

            window.location.href = data.checkout_url;

        } else {

            alert("Checkout failed");
        }

    } catch (err) {

        console.error("FETCH ERROR:", err);
    }
};

renderCart();
loadCatalog();
</script>

</body>
</html>
