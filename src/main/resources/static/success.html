<!DOCTYPE html>
<html>
<head>

    <title>Order Confirmed | Smitten</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>

        @import url('https://fonts.cdnfonts.com/css/brandon-grotesque');

        body {
            margin: 0;
            background: #faf7f2;
            color: #2f2a25;
            font-family: 'Brandon Grotesque', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            background: white;
            border: 1px solid #eadfd5;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 34px;
            font-weight: 500;
            letter-spacing: .04em;
            margin-bottom: 14px;
        }

        p {
            font-size: 16px;
            line-height: 1.7;
            color: #6f5d52;
            margin-bottom: 28px;
        }

        a {
            display: inline-block;
            border: 1px solid #2f2a25;
            background: #2f2a25;
            color: white;
            padding: 14px 22px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: .12em;
            font-size: 11px;
            transition: .2s ease;
        }

        a:hover {
            background: white;
            color: #2f2a25;
        }

        .small {
            margin-top: 24px;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #9a8171;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>Order Confirmed</h1>

    <p>
        Your order has been received and is officially en route
        to becoming your next favorite thing.
    </p>

    <a href="/fbcheckout">
        Continue Shopping
    </a>

    <div class="small">
        Thank you for shopping Smitten
    </div>

</div>
<script>
    localStorage.removeItem("smitten_cart");
    sessionStorage.removeItem("checkout_started");
</script>
</body>
</html>
